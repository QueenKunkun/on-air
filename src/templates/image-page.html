<!DOCTYPE html>
<html lang="en" class="onair-md">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<base href="/preview/{{ID}}/" />
<title>{{TITLE}} · OnAir</title>
<style>{{CSS}}</style>
<style>
#content {
	flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
	padding: 32px 0 80px 24px; box-sizing: border-box; overflow: auto;
}
#content .title {
	color: #888; font-size: 13px; margin-bottom: 12px;
	font-family: ui-monospace, Menlo, monospace; word-break: break-all; text-align: center;
}
#content img {
	max-width: 100%; max-height: 85vh; object-fit: contain;
	border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,.4);
	background: repeating-conic-gradient(#2a2a2a 0% 25%, #333 0% 50%) 0 0 / 16px 16px;
}
#content .info {
	color: #666; font-size: 12px; margin-top: 12px;
	font-family: ui-monospace, Menlo, monospace;
}
</style>
</head>
<body>
<div class="md-online-banner" id="banner"></div>
<div id="toggle-layer"><div class="panel-toggle" data-panel="files" title="Toggle file tree">&lsaquo;</div></div>
<div id="wrapper"><div id="filesSide"><div id="fileTree"><div id="ft-preact-root" data-id="{{ID}}" data-fullpath="{{FULL_PATH_ATTR}}" data-rootdir="{{ROOT_DIR_ATTR}}"></div></div></div><div class="files-resizer" id="filesResizer"></div><div id="edgeHandles"><div class="edge-handle" data-panel="files" title="Show file tree">Files</div></div><article id="content"><div class="title">{{TITLE}}</div><img src="{{SRC}}" alt="{{TITLE}}" id="img" /><div class="info" id="info"></div></article></div>
<script>
window.__ONAIR__ = {
	id: {{ID_JSON}},
	fullPath: {{FULL_PATH_JSON}},
	relPath: '',
	rootDir: {{ROOT_DIR_JSON}},
	themes: {{THEMES}},
	version: {{VERSION_JSON}}
};
</script>
<script>
(function () {
	var img = document.getElementById('img');
	var info = document.getElementById('info');
	if (!img) return;
	img.onload = function () {
		info.textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' · ' + {{SIZE_JSON}};
	};
	if (img.complete) { img.onload(); }
})();
</script>
<script>{{PREACT_JS}}</script>
</body>
</html>
