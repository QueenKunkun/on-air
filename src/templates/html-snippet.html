<style>{{CSS}}</style>
<style>
.__otb,.__otp{font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:#1f2328}
.__otb{position:absolute;right:100%;top:50%;transform:translateY(-50%);background:#fff;border:1px solid #d8dee4;border-right:none;border-radius:6px 0 0 6px;padding:8px 5px;cursor:pointer;font-size:15px;line-height:1;transition:background .15s;box-shadow:-1px 1px 4px rgba(0,0,0,.08)}
.__otb:hover{background:#f6f8fa}
.__otp{position:fixed!important;right:-260px!important;top:50%!important;max-height:50vh!important;width:260px;box-sizing:border-box;z-index:2147483645!important;background:#fff;border-left:1px solid #d8dee4;padding:20px 16px;overflow:visible;transition:right .25s ease;box-shadow:-2px 0 10px rgba(0,0,0,.12);transform:translateY(-50%)}
.__otp.open{right:0!important}
.__otp #toc-header{padding:0 0 10px 0!important}
.__otp-scroll{max-height:calc(50vh - 40px);overflow-y:auto}
.__onair_banner__{pointer-events:none;padding:6px 10px!important;border-radius:6px!important;transition:padding .15s ease,border-radius .15s ease!important}
.__onair_banner__.idle{width:14px!important;height:14px!important;padding:0!important;border-radius:50%!important;overflow:hidden!important;pointer-events:auto!important;cursor:pointer!important}
.__onair_banner__.idle .banner-icon,.__onair_banner__.idle .banner-msg{display:none!important}
.__onair_banner__.idle:hover{width:auto!important;height:auto!important;padding:6px 10px!important;border-radius:6px!important;overflow:visible!important}
.__onair_banner__.idle:hover .banner-icon,.__onair_banner__.idle:hover .banner-msg{display:inline!important}
@media (max-width: 640px){.__onair_banner__ .banner-msg{display:none}}
</style>
<nav id="__otp" class="__otp">
<button id="__otb" class="__otb" style="display:none" aria-label="Toggle TOC">&lt;</button>
<div class="__otp-scroll"><nav id="toc" class="toc"></nav></div>
</nav>
<div id="__onair_banner__" class="__onair_banner__" title="OnAir live preview active…" style="position:fixed!important;bottom:12px!important;right:12px!important;z-index:2147483647!important;background:#0969da!important;color:#fff!important;font:12px -apple-system,BlinkMacSystemFont,sans-serif!important;box-shadow:0 2px 8px rgba(0,0,0,.25)!important;opacity:.88!important;"><span class="banner-icon">🔌</span><span class="banner-msg">OnAir live preview active…</span></div>
<script>
(function () {
	var bannerEl = document.getElementById('__onair_banner__');
	var tocBtn = document.getElementById('__otb');
	var tocPanel = document.getElementById('__otp');
	var id = {{ID_JSON}};
	var fullPath = {{FULL_PATH_JSON}};
	var fileTitle = {{TITLE_JSON}};
	var proto = location.protocol === 'https:' ? 'wss' : 'ws';
	var ws, reconnectTimer, idleTimer;

	function scheduleIdle() {
		clearTimeout(idleTimer);
		idleTimer = setTimeout(function () { bannerEl.classList.add('idle'); }, 4000);
	}
	function wakeBanner() {
		clearTimeout(idleTimer);
		bannerEl.classList.remove('idle');
	}

	{{TOC_JS}}

	function buildToc() {
		var toc = document.getElementById('toc');
		while (toc.firstChild) toc.removeChild(toc.firstChild);
		var hs = document.querySelectorAll('h1,h2,h3,h4,h5,h6');
		tocBtn.style.display = '';
		toc.classList.toggle('no-tree', hs.length < 2);

		var master = buildTocHeader(toc, fileTitle, fullPath);
		if (hs.length >= 2) {
			buildTocTree(hs, toc);
			initMasterToggle(toc, master);
			bindTocInteractions(toc, document);
		}

		buildRelatedLinks(toc, document);
	}

	tocBtn.onclick = function () {
		var open = tocPanel.classList.toggle('open');
		tocBtn.textContent = open ? '>' : '<';
	};

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', buildToc);
	} else {
		buildToc();
	}

	function connect() {
		ws = new WebSocket(proto + '://' + location.host + '/ws/' + id);
		ws.onopen = function () {
			bannerEl.title = 'OnAir live preview active…'; bannerEl.querySelector('.banner-icon').textContent = '🔌'; bannerEl.querySelector('.banner-msg').textContent = 'OnAir live preview active…';
			bannerEl.style.background = '#0969da';
			clearTimeout(reconnectTimer);
			wakeBanner(); scheduleIdle();
		};
		ws.onmessage = function (ev) {
			try {
				var msg = JSON.parse(ev.data);
				if (msg.type === 'reload') {
					location.reload();
				} else if (msg.type === 'closed') {
					bannerEl.title = 'Source file was closed in VS Code'; bannerEl.querySelector('.banner-icon').textContent = '⚠️'; bannerEl.querySelector('.banner-msg').textContent = 'Source file was closed in VS Code';
					bannerEl.style.background = '#bc4c00';
					wakeBanner(); scheduleIdle();
				}
			} catch (e) { /* ignore malformed message */ }
		};
		ws.onclose = function () {
			bannerEl.title = '⚠️ Connection lost, reconnecting…'; bannerEl.querySelector('.banner-icon').textContent = '⚠️'; bannerEl.querySelector('.banner-msg').textContent = 'Connection lost, reconnecting…';
			bannerEl.style.background = '#bc4c00';
			wakeBanner(); scheduleIdle();
			reconnectTimer = setTimeout(connect, 1500);
		};
	}
	connect();
})();
</script>
