<style>{{CSS}}</style>
<style>
.__otb,.__otp{font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:#1f2328}
.__otb{position:fixed!important;right:0!important;top:50%!important;z-index:2147483646!important;transform:translateY(-50%);background:#fff;border:1px solid #d8dee4;border-right:none;border-radius:6px 0 0 6px;padding:8px 5px;cursor:pointer;font-size:15px;line-height:1;transition:right .25s ease,transform .15s;box-shadow:-1px 1px 4px rgba(0,0,0,.08)}
body:has(.__otp.open) .__otb{right:260px!important}
.__otb:hover{transform:translateY(-50%) translateX(-2px)}
.__otp{position:fixed!important;right:-280px!important;top:50%!important;max-height:50vh!important;width:260px;z-index:2147483645!important;background:#fff;border-left:1px solid #d8dee4;padding:20px 16px;overflow-y:auto;transition:right .25s ease;box-shadow:-2px 0 10px rgba(0,0,0,.12);transform:translateY(-50%)}
.__otp.open{right:0!important}
.__otp ul{list-style:none;padding:0;margin:12px 0 0}
.__otp a{color:#1f2328;text-decoration:none;display:block;padding:3px 8px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.__otp a:hover{background:#f6f8fa;color:#0969da}
.__otp .l2{padding-left:20px;font-size:12px}
.__otp .l3{padding-left:36px;font-size:12px}
.__otp .l4,.__otp .l5,.__otp .l6{padding-left:52px;font-size:11px}
.__otp .hdr{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.__otp .hdr .close{cursor:pointer;font-size:16px;line-height:1;color:#59636e;background:none;border:none;padding:0 4px}
.__otp .hdr .close:hover{color:#1f2328}
.__otp .hdr .copy-btn{cursor:pointer;font-size:14px;line-height:1;color:#59636e;background:none;border:none;padding:0 4px}
.__otp .hdr .copy-btn:hover{color:#1f2328}
.__otp .hdr .hdr-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.__otp .r{display:flex;align-items:center;gap:1px}
.__otp .t{width:16px;height:16px;flex-shrink:0;padding:0;border:none;border-radius:3px;background:transparent;color:#59636e;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}
.__otp .t:hover{background:#f6f8fa;color:#1f2328}
.__otp .s{width:16px;flex-shrink:0;display:inline-block}
.__otp ul ul{padding-left:14px}
.__otp ul ul.c{display:none}
.__otp li{margin:1px 0}
@media (max-width: 640px){.__onair_banner__ .banner-msg{display:none}}
</style>
<div id="__otb" class="__otb" style="display:none">📑</div>
<nav id="__otp" class="__otp"><div class="hdr">📑 <span id="__otpTitle">Table of Contents</span><span class="hdr-actions"><button class="copy-btn" id="__copyBtn" title="Copy full path">📋</button><button class="close" onclick="document.getElementById('__otp').classList.remove('open')">✕</button></span></div></nav>
<div id="__onair_banner__" class="__onair_banner__" title="OnAir live preview active…" style="position:fixed!important;bottom:12px!important;right:12px!important;z-index:2147483647!important;background:#0969da!important;color:#fff!important;font:12px -apple-system,BlinkMacSystemFont,sans-serif!important;padding:6px 10px!important;border-radius:6px!important;box-shadow:0 2px 8px rgba(0,0,0,.25)!important;opacity:.88!important;pointer-events:none!important;"><span class="banner-icon">🔌</span><span class="banner-msg">OnAir live preview active…</span></div>
<script>
(function () {
	var bannerEl = document.getElementById('__onair_banner__');
	var tocBtn = document.getElementById('__otb');
	var tocPanel = document.getElementById('__otp');
	var id = {{ID_JSON}};
	var fullPath = {{FULL_PATH_JSON}};
	var fileTitle = {{TITLE_JSON}};
	var proto = location.protocol === 'https:' ? 'wss' : 'ws';
	var ws, reconnectTimer;

	{{TOC_JS}}

	function buildToc() {
		var old = tocPanel.querySelector('.toc-tree');
		if (old) old.remove();
		var hs = document.querySelectorAll('h1,h2,h3,h4,h5,h6');
		if (hs.length < 2) { tocBtn.style.display = 'none'; return; }
		tocBtn.style.display = '';

		document.getElementById('__otpTitle').textContent = fileTitle;
		tocPanel.title = fullPath;

		var tree = document.createElement('div');
		tree.className = 'toc-tree';
		buildTocTree(hs, tree);
		tocPanel.appendChild(tree);

		// Override clicks for smooth scroll
		var links = tree.querySelectorAll('a');
		for (var i = 0; i < links.length; i++) {
			(function(a) {
				a.onclick = function(e) {
					e.preventDefault();
					var id = a.getAttribute('href').substring(1);
					var target = document.getElementById(id);
					if (target) target.scrollIntoView({ behavior: 'smooth' });
				};
			})(links[i]);
		}
	}

	document.getElementById('__copyBtn').onclick = function () {
		navigator.clipboard.writeText(fullPath).catch(function(){});
	};
	tocBtn.onclick = function () { tocPanel.classList.toggle('open'); };

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', buildToc);
	} else {
		buildToc();
	}

	function connect() {
		ws = new WebSocket(proto + '://' + location.host + '/ws/' + id);
		ws.onopen = function () {
			bannerEl.title = 'OnAir live preview active…'; bannerEl.querySelector('.banner-icon').textContent = '🔌'; bannerEl.querySelector('.banner-msg').textContent = 'OnAir live preview active…';
			bannerEl.style.background = '#0969da';
			clearTimeout(reconnectTimer);
		};
		ws.onmessage = function (ev) {
			try {
				var msg = JSON.parse(ev.data);
				if (msg.type === 'reload') {
					location.reload();
				} else if (msg.type === 'closed') {
					bannerEl.title = 'Source file was closed in VS Code'; bannerEl.querySelector('.banner-icon').textContent = '⚠️'; bannerEl.querySelector('.banner-msg').textContent = 'Source file was closed in VS Code';
					bannerEl.style.background = '#bc4c00';
				}
			} catch (e) { /* ignore malformed message */ }
		};
		ws.onclose = function () {
			bannerEl.title = '⚠️ Connection lost, reconnecting…'; bannerEl.querySelector('.banner-icon').textContent = '⚠️'; bannerEl.querySelector('.banner-msg').textContent = 'Connection lost, reconnecting…';
			bannerEl.style.background = '#bc4c00';
			reconnectTimer = setTimeout(connect, 1500);
		};
	}
	connect();
})();
</script>
