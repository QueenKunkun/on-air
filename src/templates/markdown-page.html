<!DOCTYPE html>
<html lang="en" class="onair-md">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<base href="/preview/{{ID}}/" />
<title>{{TITLE}} · OnAir</title>
<style>{{CSS}}</style>
</head>
<body>
	<div class="md-online-banner" id="banner"><span id="bannerTxt" title="Connected, live preview active…"><span id="bannerIcon">🔌</span><span id="bannerMsg" class="banner-msg">Connected, live preview active…</span></span>
	<select class="bp-select" id="themeSelect" title="Theme">
		<option value="auto">🌓 Auto</option>
		<option value="dark">🌙 Dark</option>
		<option value="light">☀️ Light</option>
	</select>
	<button class="wp-btn" id="wpBtn" title="Toggle word wrapping for code blocks">Wrap code</button>
	<span class="bp-group"><span class="bp-label" title="Font size">A</span>
		<button class="bp-btn" id="fsDec" title="Decrease font size">−</button>
		<input class="fs-input" id="fsInput" type="number" min="12" max="28" value="16" title="Font size (12-28)">
		<button class="bp-btn" id="fsReset" title="Reset font size to default">↺</button>
		<button class="bp-btn" id="fsInc" title="Increase font size">+</button></span>
	<span class="bp-group"><span class="bp-label" title="Scrollbar width">‖</span>
		<button class="bp-btn" id="sbDec" title="Thinner scrollbars">−</button>
		<input class="fs-input" id="sbInput" type="number" min="0" step="4" value="16" title="Scrollbar width">
		<button class="bp-btn" id="sbReset" title="Reset scrollbar width to default">↺</button>
		<button class="bp-btn" id="sbInc" title="Thicker scrollbars">+</button></span></div>
	<div id="wrapper"><div id="tocSide"><nav id="toc" class="toc"></nav><button id="tocToggle" class="toc-toggle" aria-label="Toggle table of contents">&lt;</button></div><div class="toc-resizer" id="tocResizer"></div><article class="markdown-body" id="content">{{BODY}}</article></div>
	<script>
	(function () {
		var bannerEl = document.getElementById('banner');
		var bannerTxt = document.getElementById('bannerTxt');
		var bannerIcon = document.getElementById('bannerIcon');
		var bannerMsg = document.getElementById('bannerMsg');
		var contentEl = document.getElementById('content');
		var id = {{ID_JSON}};
		var fullPath = {{FULL_PATH_JSON}};
		var relPath = {{REL_PATH_JSON}};
		var proto = location.protocol === 'https:' ? 'wss' : 'ws';
		var ws, reconnectTimer;

		// ---- wrap toggle ----
		document.getElementById('wpBtn').onclick = function () {
			this.classList.toggle('on');
			this.textContent = this.classList.contains('on') ? 'Unwrap code' : 'Wrap code';
			contentEl.classList.toggle('wp');
		};

		// ---- theme select ----
		var themeSelect = document.getElementById('themeSelect');
		var html = document.documentElement;
		var saved = localStorage.getItem('onair-theme');
		if (saved) { themeSelect.value = saved; }
		applyTheme(themeSelect.value);

		themeSelect.onchange = function () {
			localStorage.setItem('onair-theme', this.value);
			applyTheme(this.value);
		};

		function applyTheme(val) {
			html.classList.remove('force-dark', 'force-light');
			if (val === 'dark') html.classList.add('force-dark');
			else if (val === 'light') html.classList.add('force-light');
		}

		// ---- font size ----
		var fs = parseInt(localStorage.getItem('onair-font-size')) || 16;
		var fsInput = document.getElementById('fsInput');
		contentEl.style.fontSize = fs + 'px';
		fsInput.value = fs;
		document.getElementById('fsDec').onclick = function () { setFs(fs - 2); };
		document.getElementById('fsInc').onclick = function () { setFs(fs + 2); };
		document.getElementById('fsReset').onclick = function () { setFs(16); };
		fsInput.onchange = function () {
			var v = parseInt(this.value);
			if (isNaN(v)) { this.value = fs; return; }
			setFs(v);
		};
		function withScrollAnchor(fn) {
			var se = document.scrollingElement || document.documentElement;
			var kids = contentEl.children, anchor = null;
			for (var i = 0; i < kids.length; i++) {
				if (kids[i].getBoundingClientRect().bottom > 0) { anchor = kids[i]; break; }
			}
			var before = anchor ? anchor.getBoundingClientRect().top : 0;
			fn();
			if (anchor) se.scrollTop += anchor.getBoundingClientRect().top - before;
		}
		function setFs(v) {
			withScrollAnchor(function () {
				fs = Math.max(12, Math.min(28, Math.round(v)));
				contentEl.style.fontSize = fs + 'px';
			});
			fsInput.value = fs;
			localStorage.setItem('onair-font-size', String(fs));
		}

		// ---- scrollbar width ----
		var sbw = parseInt(localStorage.getItem('onair-scrollbar-width')) || 16;
		var sbInput = document.getElementById('sbInput');
		setSbw(sbw);
		document.getElementById('sbDec').onclick = function () { setSbw(sbw - 4); };
		document.getElementById('sbInc').onclick = function () { setSbw(sbw + 4); };
		document.getElementById('sbReset').onclick = function () { setSbw(16); };
		sbInput.onchange = function () {
			var v = parseInt(this.value);
			if (isNaN(v)) { this.value = sbw; return; }
			setSbw(v);
		};
		function setSbw(v) {
			sbw = Math.max(0, Math.round(v));
			document.documentElement.style.setProperty('--sb-w', sbw + 'px');
			sbInput.value = sbw;
			localStorage.setItem('onair-scrollbar-width', String(sbw));
		}

		{{TOC_JS}}

		// ---- table of contents ----
		function buildToc() {
			var toc = document.getElementById('toc');
			while (toc.firstChild) toc.removeChild(toc.firstChild);
			var hs = contentEl.querySelectorAll('h1,h2,h3,h4,h5,h6');
			toc.classList.toggle('no-tree', hs.length < 2);

			var master = buildTocHeader(toc, '📑 ' + document.title.replace(/ · OnAir$/, ''), fullPath, relPath);

			if (hs.length >= 2) {
				var listContainer = document.createElement('div');
				listContainer.id = 'toc-list';
				buildTocTree(hs, listContainer);
				initMasterToggle(toc, master);
				toc.appendChild(listContainer);
			bindTocInteractions(toc, contentEl);
		}

		buildRelatedLinks(toc, contentEl);
	}

		// ---- footnotes: wrap bottom block in a collapsible container ----
		function processFootnotes() {
			var sec = contentEl.querySelector('section.footnotes');
			if (!sec) return;
			var sep = contentEl.querySelector('hr.footnotes-sep');
			if (sep) sep.parentNode.removeChild(sep);
			var block = document.createElement('div');
			block.id = 'footnotes-block';
			var head = document.createElement('div');
			head.id = 'footnotes-head';
			var toggle = document.createElement('button');
			toggle.className = 'fn-toggle';
			toggle.type = 'button';
			var title = document.createElement('span');
			title.textContent = 'Footnotes';
			head.appendChild(toggle);
			head.appendChild(title);
			sec.parentNode.insertBefore(block, sec);
			block.appendChild(head);
			block.appendChild(sec);
			function setCollapsed(c) {
				block.classList.toggle('collapsed', c);
				toggle.textContent = c ? '\u25B8' : '\u25BE';
				localStorage.setItem('onair-footnotes-collapsed', c ? '1' : '0');
			}
			setCollapsed(localStorage.getItem('onair-footnotes-collapsed') === '1');
			head.onclick = function () { setCollapsed(!block.classList.contains('collapsed')); };
		}

		// ---- TOC resize ----
		(function () {
			var resizer = document.getElementById('tocResizer');
			var toc = document.getElementById('toc');
			attachResizer(resizer, toc, {
				axis: 'x', invert: false, key: 'onair-toc-width', def: null, min: 24, max: Infinity,
				get: function (el) { return el.offsetWidth; },
				set: function (el, v) { el.style.width = v + 'px'; }
			});
		})();

		// ---- TOC collapse handle ----
		(function () {
			var handle = document.getElementById('tocToggle');
			var side = document.getElementById('tocSide');
			function setCollapsed(c) {
				side.classList.toggle('collapsed', c);
				handle.textContent = c ? '>' : '<';
				handle.title = c ? 'Show table of contents' : 'Hide table of contents';
				localStorage.setItem('onair-toc-collapsed', c ? '1' : '0');
			}
			setCollapsed(localStorage.getItem('onair-toc-collapsed') === '1');
			handle.onclick = function () { setCollapsed(!side.classList.contains('collapsed')); };
		})();

		// ---- websocket ----
		function connect() {
			ws = new WebSocket(proto + '://' + location.host + '/ws/' + id);
			ws.onopen = function () {
				bannerIcon.textContent = '🔌'; bannerMsg.textContent = 'Connected, live preview active…'; bannerTxt.title = 'Connected, live preview active…';
				bannerEl.classList.remove('offline');
				clearTimeout(reconnectTimer);
			};
			ws.onmessage = function (ev) {
				try {
					var msg = JSON.parse(ev.data);
					if (msg.type === 'update') {
						contentEl.innerHTML = msg.html;
						if (msg.fullPath) fullPath = msg.fullPath;
						if (msg.relPath != null) relPath = msg.relPath;
						buildToc();
						processFootnotes();
						if (document.getElementById('wpBtn').classList.contains('on')) contentEl.classList.add('wp');
						document.title = msg.title + ' · OnAir';
					} else if (msg.type === 'closed') {
						bannerIcon.textContent = '⚠️'; bannerMsg.textContent = 'Source file was closed in VS Code, preview will no longer update'; bannerTxt.title = 'Source file was closed in VS Code, preview will no longer update';
						bannerEl.classList.add('offline');
					}
				} catch (e) { /* ignore malformed message */ }
			};
			ws.onclose = function () {
				bannerIcon.textContent = '⚠️'; bannerMsg.textContent = 'Connection lost, reconnecting…'; bannerTxt.title = 'Connection lost, reconnecting…';
				bannerEl.classList.add('offline');
				reconnectTimer = setTimeout(connect, 1500);
			};
		}
		connect();
		buildToc();
		processFootnotes();
	})();
	</script>
</body>
</html>
