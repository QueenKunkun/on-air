<!DOCTYPE html>
<html lang="en" class="onair-md">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<base href="/preview/{{ID}}/" />
<title>{{TITLE}} · OnAir</title>
<style>{{CSS}}</style>
<style>{{KATEX_CSS}}</style>
</head>
<body>
	<div class="md-online-banner" id="banner"></div>
	<div id="wrapper"><div id="filesSide"><div id="fileTree"><div id="ft-preact-root" data-id="{{ID}}" data-fullpath="{{FULL_PATH_ATTR}}" data-rootdir="{{ROOT_DIR_ATTR}}"></div></div></div><div class="files-resizer" id="filesResizer"></div><div id="tocCol"><nav id="toc" class="toc"></nav></div><div class="toc-resizer" id="tocResizer"></div><div id="edgeHandles"><div class="edge-handle" data-panel="files" title="Show file tree">Files</div><div class="edge-handle" data-panel="toc" title="Show table of contents">TOC</div></div><article class="markdown-body" id="content">{{BODY}}</article><div class="annot-resizer" id="annotResizer"></div><div id="annotSide"><div id="annots"></div><button id="annotToggle" class="annot-toggle" aria-label="Toggle annotations">&gt;</button></div></div>
	<script>
	window.__ONAIR__ = {
		id: {{ID_JSON}},
		fullPath: {{FULL_PATH_JSON}},
		relPath: {{REL_PATH_JSON}},
		rootDir: {{ROOT_DIR_JSON}},
		themes: {{THEMES}},
		version: {{VERSION_JSON}}
	};
	</script>
	<script>{{PREACT_JS}}</script>
</body>
</html>
