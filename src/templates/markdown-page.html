<!DOCTYPE html>
<html lang="en" class="onair-md">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<base href="/preview/{{ID}}/" />
<title>{{TITLE}} · OnAir</title>
<style>{{CSS}}</style>
</head>
<body>
	<div class="md-online-banner" id="banner"><span id="bannerTxt" title="Connected, live preview active…"><span id="bannerIcon">🔌</span><span id="bannerMsg" class="banner-msg">Connected, live preview active…</span></span>
	<div class="tb-center">	<select class="bp-select" id="themeSelect" title="Theme"></select>
	<button class="wp-btn" id="wpBtn" title="Toggle word wrapping for code blocks">Wrap code</button>
	<button class="wp-btn" id="hoverBtn" title="Toggle hover preview for footnote/annotation notes">Hover notes</button>
	<span class="bp-group"><span class="bp-label" title="Font size">A</span>
		<button class="bp-btn" id="fsDec" title="Decrease font size">−</button>
		<input class="fs-input" id="fsInput" type="number" min="12" max="28" value="16" title="Font size (12-28)">
		<button class="bp-btn" id="fsReset" title="Reset font size to default">↺</button>
		<button class="bp-btn" id="fsInc" title="Increase font size">+</button></span>
	<span class="bp-group"><span class="bp-label" title="Scrollbar width">‖</span>
		<button class="bp-btn" id="sbDec" title="Thinner scrollbars">−</button>
		<input class="fs-input" id="sbInput" type="number" min="0" step="4" value="16" title="Scrollbar width">
		<button class="bp-btn" id="sbReset" title="Reset scrollbar width to default">↺</button>
		<button class="bp-btn" id="sbInc" title="Thicker scrollbars">+</button></span>
	<span class="bp-group"><span class="bp-label" title="Max content width (0 = no limit)">W</span>
		<button class="bp-btn" id="mwDec" title="Narrower content">−</button>
		<input class="fs-input" id="mwInput" type="number" min="0" step="20" value="920" title="Max content width in px (0 = no limit)">
		<button class="bp-btn" id="mwReset" title="Reset max width to default">↺</button>
		<button class="bp-btn" id="mwInc" title="Wider content">+</button></span></div>
	<div class="ver-badge" id="verBadge" data-version="v{{VERSION}}" title="Click to copy version">v{{VERSION}}</div></div>
	<div id="wrapper"><div id="tocSide"><div class="sidebar-tabs"><button class="sidebar-tab tab-toc active" id="tabToc">📑 TOC</button><button class="sidebar-tab tab-tree" id="tabTree">📁 Files</button></div><nav id="toc" class="toc"></nav><div id="fileTree"><div class="ft-filter"><label><input type="checkbox" id="ftGitignore" checked> .gitignore</label><label><input type="checkbox" id="ftMarkdown"> .md</label><label><input type="checkbox" id="ftBinary" checked> Hide binary</label><span class="ft-filter-spacer"></span><button class="ft-locate-btn" id="ftLocateBtn" title="Scroll to current file">📍</button></div><div class="ft-scroll" id="ftScroll"></div></div><button id="tocToggle" class="toc-toggle" aria-label="Toggle table of contents">&lt;</button></div><div class="toc-resizer" id="tocResizer"></div><article class="markdown-body" id="content">{{BODY}}</article><div class="annot-resizer" id="annotResizer"></div><div id="annotSide"><div id="annots"></div><button id="annotToggle" class="annot-toggle" aria-label="Toggle annotations">&gt;</button></div></div>
	<script>
	(function () {
		var bannerEl = document.getElementById('banner');
		var bannerTxt = document.getElementById('bannerTxt');
		var bannerIcon = document.getElementById('bannerIcon');
		var bannerMsg = document.getElementById('bannerMsg');
		var contentEl = document.getElementById('content');
		var id = {{ID_JSON}};
		var fullPath = {{FULL_PATH_JSON}};
		var relPath = {{REL_PATH_JSON}};
		var rootDir = {{ROOT_DIR_JSON}};
		
		function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c) { return '&#' + c.charCodeAt(0) + ';'; }); }
		var proto = location.protocol === 'https:' ? 'wss' : 'ws';
		var ws, reconnectTimer;

		// ---- wrap toggle ----
		document.getElementById('wpBtn').onclick = function () {
			this.classList.toggle('on');
			this.textContent = this.classList.contains('on') ? 'Unwrap code' : 'Wrap code';
			contentEl.classList.toggle('wp');
		};

		// ---- theme select ----
		var __THEMES__ = {{THEMES}};
		var themeSelect = document.getElementById('themeSelect');
		var html = document.documentElement;
		if (__THEMES__) {
			for (var i = 0; i < __THEMES__.length; i++) {
				var opt = document.createElement('option');
				opt.value = __THEMES__[i].id;
				opt.textContent = __THEMES__[i].label;
				themeSelect.appendChild(opt);
			}
		}
		var saved = localStorage.getItem('onair-theme');
		if (saved === 'dark') saved = 'vscode-dark';
		if (saved === 'light') saved = 'github-light';
		if (saved) { themeSelect.value = saved; }
		applyTheme(themeSelect.value);

		themeSelect.onchange = function () {
			localStorage.setItem('onair-theme', this.value);
			applyTheme(this.value);
		};

		function applyTheme(val) {
			if (val === 'auto') { html.removeAttribute('data-theme'); }
			else { html.setAttribute('data-theme', val); }
		}

		// ---- font size ----
		var fs = parseInt(localStorage.getItem('onair-font-size')) || 16;
		var fsInput = document.getElementById('fsInput');
		contentEl.style.fontSize = fs + 'px';
		fsInput.value = fs;
		document.getElementById('fsDec').onclick = function () { setFs(fs - 2); };
		document.getElementById('fsInc').onclick = function () { setFs(fs + 2); };
		document.getElementById('fsReset').onclick = function () { setFs(16); };
		fsInput.onchange = function () {
			var v = parseInt(this.value);
			if (isNaN(v)) { this.value = fs; return; }
			setFs(v);
		};
		function withScrollAnchor(fn) {
			var se = document.scrollingElement || document.documentElement;
			var kids = contentEl.children, anchor = null;
			for (var i = 0; i < kids.length; i++) {
				if (kids[i].getBoundingClientRect().bottom > 0) { anchor = kids[i]; break; }
			}
			var before = anchor ? anchor.getBoundingClientRect().top : 0;
			fn();
			if (anchor) se.scrollTop += anchor.getBoundingClientRect().top - before;
		}
		function setFs(v) {
			withScrollAnchor(function () {
				fs = Math.max(12, Math.min(28, Math.round(v)));
				contentEl.style.fontSize = fs + 'px';
			});
			fsInput.value = fs;
			localStorage.setItem('onair-font-size', String(fs));
			if (typeof layoutCards === 'function') layoutCards();
		}

		// ---- scrollbar width ----
		var sbw = parseInt(localStorage.getItem('onair-scrollbar-width')) || 16;
		var sbInput = document.getElementById('sbInput');
		setSbw(sbw);
		document.getElementById('sbDec').onclick = function () { setSbw(sbw - 4); };
		document.getElementById('sbInc').onclick = function () { setSbw(sbw + 4); };
		document.getElementById('sbReset').onclick = function () { setSbw(16); };
		sbInput.onchange = function () {
			var v = parseInt(this.value);
			if (isNaN(v)) { this.value = sbw; return; }
			setSbw(v);
		};
		function setSbw(v) {
			sbw = Math.max(0, Math.round(v));
			document.documentElement.style.setProperty('--sb-w', sbw + 'px');
			sbInput.value = sbw;
			localStorage.setItem('onair-scrollbar-width', String(sbw));
		}

		// ---- max content width ----
		var mwInput = document.getElementById('mwInput');
		var mw = parseInt(localStorage.getItem('onair-max-width'));
		if (isNaN(mw)) mw = 920;
		setMw(mw);
		document.getElementById('mwDec').onclick = function () { setMw(mw - 20); };
		document.getElementById('mwInc').onclick = function () { setMw(mw + 20); };
		document.getElementById('mwReset').onclick = function () { setMw(920); };
		mwInput.onchange = function () {
			var v = parseInt(this.value);
			if (isNaN(v) || v < 0) { this.value = mw; return; }
			setMw(v);
		};
		function setMw(v) {
			mw = Math.max(0, Math.round(v));
			contentEl.style.maxWidth = mw ? mw + 'px' : 'none';
			mwInput.value = mw;
			localStorage.setItem('onair-max-width', String(mw));
		}

		// ---- version badge: click to copy, with "Copied!" feedback ----
		(function () {
			var vb = document.getElementById('verBadge');
			if (!vb) return;
			var version = vb.getAttribute('data-version') || vb.textContent;
			var resetTimer;
			vb.addEventListener('click', function () {
				function flash() {
					vb.textContent = 'Copied!';
					clearTimeout(resetTimer);
					resetTimer = setTimeout(function () { vb.textContent = version; }, 1200);
				}
				try {
					if (navigator.clipboard && navigator.clipboard.writeText) {
						navigator.clipboard.writeText(version).then(flash, fallback);
					} else { fallback(); }
				} catch (e) { fallback(); }
				function fallback() {
					try {
						var ta = document.createElement('textarea');
						ta.value = version; ta.style.position = 'fixed'; ta.style.opacity = '0';
						document.body.appendChild(ta); ta.select();
						document.execCommand('copy'); document.body.removeChild(ta);
						flash();
					} catch (e2) { /* ignore */ }
				}
			});
		})();

		{{TOC_JS}}

		// ---- table of contents ----
		function buildToc() {
			var toc = document.getElementById('toc');
			while (toc.firstChild) toc.removeChild(toc.firstChild);
			var hs = contentEl.querySelectorAll('h1,h2,h3,h4,h5,h6');
			toc.classList.toggle('no-tree', hs.length < 2);

			var master = buildTocHeader(toc, '📑 ' + document.title.replace(/ · OnAir$/, ''), fullPath, relPath);

			if (hs.length >= 2) {
				var listContainer = document.createElement('div');
				listContainer.id = 'toc-list';
				buildTocTree(hs, listContainer);
				initMasterToggle(toc, master);
				toc.appendChild(listContainer);
			bindTocInteractions(toc, contentEl);
		}

		buildRelatedLinks(toc, contentEl);
	}

		// ---- footnotes: wrap bottom block in a collapsible container ----
		function processFootnotes() {
			var sec = contentEl.querySelector('section.footnotes');
			if (!sec) return;
			var sep = contentEl.querySelector('hr.footnotes-sep');
			if (sep) sep.parentNode.removeChild(sep);
			var block = document.createElement('div');
			block.id = 'footnotes-block';
			var head = document.createElement('div');
			head.id = 'footnotes-head';
			var toggle = document.createElement('button');
			toggle.className = 'fn-toggle';
			toggle.type = 'button';
			var title = document.createElement('span');
			title.textContent = 'Footnotes';
			head.appendChild(toggle);
			head.appendChild(title);
			sec.parentNode.insertBefore(block, sec);
			block.appendChild(head);
			block.appendChild(sec);
			function setCollapsed(c) {
				block.classList.toggle('collapsed', c);
				toggle.textContent = c ? '\u25B8' : '\u25BE';
				localStorage.setItem('onair-footnotes-collapsed', c ? '1' : '0');
			}
			setCollapsed(localStorage.getItem('onair-footnotes-collapsed') === '1');
			head.onclick = function () { setCollapsed(!block.classList.contains('collapsed')); };
		}

		// ---- annotations: route ==mark==-adjacent notes into the right column ----
		var cardRegistry = [];
		var hoverOn = localStorage.getItem('onair-annot-hover') === '1';

		var pop = document.createElement('div');
		pop.id = 'annot-pop';
		pop.style.display = 'none';
		document.body.appendChild(pop);
		function hidePopover() { pop.style.display = 'none'; }
		function showPopover(evt, htmlStr) {
			pop.innerHTML = htmlStr;
			pop.style.display = 'block';
			pop.style.left = '0px'; pop.style.top = '0px';
			// Anchor to the mark's box (not the cursor) so the position is the same
			// whether you approach from above or below. The pointer can sit anywhere
			// within the mark and the hand extends ~24px downward, so keep the popover
			// well below the mark's bottom edge to guarantee it's never covered.
			var el = evt.currentTarget || evt.target;
			var r = el.getBoundingClientRect();
			var ph = pop.offsetHeight, pw = pop.offsetWidth;
			var gap = 30;
			var top = r.bottom + gap;
			if (top + ph > window.innerHeight - 8) {
				// no room below: flip above the mark (the hand sits below the pointer, so upward is clear)
				top = Math.max(8, r.top - ph - 12);
			}
			var left = r.left;
			if (left + pw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - pw - 8);
			pop.style.top = (top + window.pageYOffset) + 'px';
			pop.style.left = (left + window.pageXOffset) + 'px';
		}
		document.addEventListener('click', function (e) {
			if (pop.style.display !== 'none' && !pop.contains(e.target) && !(e.target.closest && e.target.closest('.annot-mark'))) hidePopover();
		});

		// ---- bare `.md` cross-reference popover (B3: reuses the same `/xref` HTML) ----
		(function () {
			var overlay = document.createElement('div');
			overlay.id = 'xrefOverlay';
			overlay.style.display = 'none';
			overlay.innerHTML = '<div class="xref-box" role="dialog"></div>';
			document.body.appendChild(overlay);
			var box = overlay.firstChild;
			// Scroll-lock: prevent the page behind from scrolling while the menu is
			// open. We compensate the removed scrollbar width via a CSS variable so
			// the layout doesn't shift (no "jump"). State lives in the class +
			// variable; CSS owns the actual overflow/padding. A counter guards
			// against nested overlays unlocking each other prematurely.
			var scrollLockCount = 0;
			function lockScroll() {
				if (scrollLockCount++ > 0) { return; }
				var sw = window.innerWidth - document.documentElement.clientWidth;
				document.documentElement.style.setProperty('--scrollbar-width', sw + 'px');
				document.body.classList.add('xref-open');
			}
			function unlockScroll() {
				if (--scrollLockCount > 0) { return; }
				document.body.classList.remove('xref-open');
				document.documentElement.style.removeProperty('--scrollbar-width');
			}
			function positionBox(anchor) {
				var r = anchor.getBoundingClientRect();
				var vw = window.innerWidth, vh = window.innerHeight;
				var bw = box.offsetWidth, bh = box.offsetHeight;
				// Prefer below the link; flip above only if it would overflow the
				// bottom AND there's room above. Always clamp into the viewport so
				// the menu is never clipped at any corner / edge (tall menus near
				// a centered link included).
				var top = r.bottom + 6;
				if (top + bh > vh && r.top - bh - 6 >= 8) { top = r.top - bh - 6; }
				top = Math.max(8, Math.min(top, vh - bh - 8));
				var left = Math.max(8, Math.min(r.left, vw - bw - 8));
				box.style.top = top + 'px';
				box.style.left = left + 'px';
			}
			function closeXref() {
				overlay.style.display = 'none';
				box.innerHTML = '';
				unlockScroll();
			}
			overlay.addEventListener('click', function (e) { if (e.target === overlay) closeXref(); });
			document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeXref(); });
			document.addEventListener('click', function (e) {
				var a = e.target.closest && e.target.closest('a.onair-xref');
				if (!a) return;
				e.preventDefault();
				var href = a.getAttribute('href');
				var sep = href.indexOf('?') >= 0 ? '&' : '?';
				var fragUrl = href + sep + 'fragment=1';
				box.innerHTML = '<div class="xref-loading">Loading…</div>';
				overlay.style.display = 'block';
				lockScroll();
				// Render first so we can measure the box, then anchor it to the link.
				fetch(fragUrl).then(function (r) { return r.text(); }).then(function (html) {
					if (overlay.style.display !== 'block') return;
					box.innerHTML = html;
					positionBox(a);
				}).catch(function () { box.innerHTML = '<p class="empty">Failed to load references.</p>'; });
			});
		})();
		function annotColumnVisible() {
			var side = document.getElementById('annotSide');
			return getComputedStyle(side).display !== 'none' && !side.classList.contains('collapsed');
		}

		function prevMark(ref) {
			var n = ref.previousSibling;
			while (n && n.nodeType === 3 && !/\S/.test(n.textContent)) n = n.previousSibling;
			if (n && n.nodeType === 1 && n.tagName === 'MARK') return n;
			return null;
		}
		function markDocY(el) { return el.getBoundingClientRect().top + window.pageYOffset; }

		function activate(aid, scroll) {
			for (var i = 0; i < cardRegistry.length; i++) {
				var on = cardRegistry[i].id === aid;
				cardRegistry[i].mark.classList.toggle('active', on);
				cardRegistry[i].card.classList.toggle('active', on);
				cardRegistry[i].card.style.zIndex = on ? '5' : '';
				if (on && scroll) cardRegistry[i].card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
			}
		}

		function layoutCards() {
			if (!cardRegistry.length) return;
			if (document.getElementById('annotSide').classList.contains('collapsed')) return;
			var annots = document.getElementById('annots');
			annots.style.minHeight = contentEl.offsetHeight + 'px';
			var base = markDocY(annots);
			var items = cardRegistry.slice().sort(function (a, b) { return markDocY(a.mark) - markDocY(b.mark); });
			var prevBottom = -1e9, gap = 12;
			for (var i = 0; i < items.length; i++) {
				var natural = markDocY(items[i].mark) - base;
				var y = Math.max(natural, prevBottom + gap);
				items[i].card.style.top = y + 'px';
				prevBottom = y + items[i].card.offsetHeight;
			}
		}

		function buildAnnotations() {
			var side = document.getElementById('annotSide');
			var annots = document.getElementById('annots');
			annots.innerHTML = '';
			cardRegistry = [];

			var refs = contentEl.querySelectorAll('sup.footnote-ref');
			var sec = contentEl.querySelector('section.footnotes');
			var liById = {};
			if (sec) {
				var lis = sec.querySelectorAll('li.footnote-item');
				for (var i = 0; i < lis.length; i++) liById[lis[i].id] = lis[i];
			}

			var annId = 0;
			for (var r = 0; r < refs.length; r++) {
				var ref = refs[r];
				var markEl = prevMark(ref);
				if (!markEl) {
					var fa = ref.querySelector('a');
					var fli = fa && liById[(fa.getAttribute('href') || '').replace(/^#/, '')];
					if (fli) {
						var fclone = fli.cloneNode(true);
						var fback = fclone.querySelector('.footnote-backref');
						if (fback) fback.parentNode.removeChild(fback);
						(function (m, htmlStr) {
							m.onmouseenter = function (e) { if (hoverOn) showPopover(e, htmlStr); };
							m.onmouseleave = function () { if (hoverOn) hidePopover(); };
						})(ref, fclone.innerHTML);
					}
					continue;
				}
				var a = ref.querySelector('a');
				if (!a) continue;
				var fnId = (a.getAttribute('href') || '').replace(/^#/, '');
				var li = liById[fnId];
				if (!li) continue;

				annId++;
				var aid = 'a' + annId;
				markEl.setAttribute('data-annot-id', aid);
				markEl.classList.add('annot-mark');
				ref.style.display = 'none';

				var card = document.createElement('div');
				card.className = 'annot-card';
				card.setAttribute('data-annot-id', aid);
				var clone = li.cloneNode(true);
				var back = clone.querySelector('.footnote-backref');
				if (back) back.parentNode.removeChild(back);
				var cardHtml = clone.innerHTML;
				card.innerHTML = cardHtml;
				annots.appendChild(card);
				li.parentNode.removeChild(li);

				cardRegistry.push({ id: aid, mark: markEl, card: card });
				(function (id, mark, cardEl, htmlStr) {
					mark.onclick = function (e) {
						if (annotColumnVisible()) { activate(id, true); }
						else { showPopover(e, htmlStr); if (e) e.stopPropagation(); }
					};
					cardEl.onclick = function () { activate(id, false); };
					mark.onmouseenter = function (e) {
						if (!hoverOn) return;
						if (annotColumnVisible()) activate(id, false); else showPopover(e, htmlStr);
					};
					mark.onmouseleave = function () { if (hoverOn && !annotColumnVisible()) hidePopover(); };
					cardEl.onmouseenter = function () { if (hoverOn) activate(id, false); };
				})(aid, markEl, card, cardHtml);
			}

			if (sec && !sec.querySelector('li.footnote-item')) {
				var sep = contentEl.querySelector('hr.footnotes-sep');
				if (sep) sep.parentNode.removeChild(sep);
				sec.parentNode.removeChild(sec);
			}

			var has = cardRegistry.length > 0;
			side.style.display = has ? '' : 'none';
			document.getElementById('annotResizer').style.display = (has && !side.classList.contains('collapsed')) ? '' : 'none';
			if (has) layoutCards();
		}

		// ---- annotation column resize ----
		(function () {
			attachResizer(document.getElementById('annotResizer'), document.getElementById('annotSide'), {
				axis: 'x', invert: true, key: 'onair-annot-width', def: null, min: 120, max: Infinity,
				get: function (el) { return el.offsetWidth; },
				set: function (el, v) { el.style.width = v + 'px'; layoutCards(); }
			});
		})();

		// ---- annotation column collapse handle ----
		(function () {
			var handle = document.getElementById('annotToggle');
			var side = document.getElementById('annotSide');
			var resizer = document.getElementById('annotResizer');
			function setCollapsed(c) {
				side.classList.toggle('collapsed', c);
				handle.textContent = c ? '<' : '>';
				handle.title = c ? 'Show annotations' : 'Hide annotations';
				if (cardRegistry.length) resizer.style.display = c ? 'none' : '';
				localStorage.setItem('onair-annot-collapsed', c ? '1' : '0');
				if (!c) layoutCards();
			}
			setCollapsed(localStorage.getItem('onair-annot-collapsed') === '1');
			handle.onclick = function () { setCollapsed(!side.classList.contains('collapsed')); };
		})();

		// ---- hover-preview switch (shared by footnotes/annotations) ----
		(function () {
			var hoverBtn = document.getElementById('hoverBtn');
			if (hoverOn) hoverBtn.classList.add('on');
			hoverBtn.onclick = function () {
				hoverOn = !hoverOn;
				this.classList.toggle('on', hoverOn);
				localStorage.setItem('onair-annot-hover', hoverOn ? '1' : '0');
				if (!hoverOn) hidePopover();
			};
		})();

		window.addEventListener('resize', function () { layoutCards(); hidePopover(); });
		window.addEventListener('load', function () { layoutCards(); });

		// ---- Sidebar resize (shared between TOC and Files tabs) ----
		(function () {
			var resizer = document.getElementById('tocResizer');
			var side = document.getElementById('tocSide');
			attachResizer(resizer, side, {
				axis: 'x', invert: false, key: 'onair-toc-width', def: null, min: 120, max: Infinity,
				get: function (el) { return el.offsetWidth; },
				set: function (el, v) { el.style.width = v + 'px'; }
			});
		})();

		// ---- TOC collapse handle ----
		(function () {
			var handle = document.getElementById('tocToggle');
			var side = document.getElementById('tocSide');
			function setCollapsed(c) {
				side.classList.toggle('collapsed', c);
				handle.textContent = c ? '>' : '<';
				handle.title = c ? 'Show table of contents' : 'Hide table of contents';
				localStorage.setItem('onair-toc-collapsed', c ? '1' : '0');
			}
			setCollapsed(localStorage.getItem('onair-toc-collapsed') === '1');
			handle.onclick = function () { setCollapsed(!side.classList.contains('collapsed')); };
		})();

		// ---- file tree: tab switching, tree navigation, file opening ----
		try {
		(function () {
			var tocPanel = document.getElementById('toc');
			var treePanel = document.getElementById('fileTree');
			var tabToc = document.getElementById('tabToc');
			var tabTree = document.getElementById('tabTree');
			var ftScroll = document.getElementById('ftScroll');

			function getCheck(id) { var el = document.getElementById(id); return el ? el.checked : false; }

			function filterParams(dir) {
				var params = 'id=' + encodeURIComponent(id) + '&dir=' + encodeURIComponent(dir);
				if (getCheck('ftGitignore')) params += '&respectGitignore=1';
				if (getCheck('ftMarkdown')) params += '&ext=.md';
				if (getCheck('ftBinary')) params += '&hideBinary=1';
				return params;
			}

			// -- cache and state --
			var ftCache = {};
			var ftExpanded = {};
			var ftExpandedToFile = false;

			function fetchDir(path) {
				return fetch('/api/tree?' + filterParams(path)).then(function (r) { return r.json(); });
			}

			function getCachedOrFetch(path) {
				if (ftCache[path]) return Promise.resolve(ftCache[path]);
				return fetchDir(path).then(function (data) {
					if (data.error) return Promise.reject(new Error(data.error));
					ftCache[path] = data;
					return data;
				});
			}

			function clearAllCache() { for (var key in ftCache) delete ftCache[key]; }

			// -- rendering --
			function renderDirContent(data, container) {
				container.innerHTML = '';
				var dirs = [], files = [];
				for (var i = 0; i < data.entries.length; i++) {
					if (data.entries[i].type === 'directory') dirs.push(data.entries[i]);
					else files.push(data.entries[i]);
				}
				dirs.sort(function (a, b) { return a.name.localeCompare(b.name); });
				files.sort(function (a, b) { return a.name.localeCompare(b.name); });
				var all = dirs.concat(files);
				for (var i = 0; i < all.length; i++) {
					var e = all[i];
					var li = document.createElement('li');
					li.className = 'ft-item ft-' + e.type;
					if (e.type === 'directory') {
						var toggle = document.createElement('span');
						toggle.className = 'ft-toggle';
						toggle.textContent = '\u25B6';
						toggle.dataset.path = e.path;
						li.appendChild(toggle);
						var name = document.createElement('span');
						name.className = 'ft-name';
						name.textContent = e.name;
						li.appendChild(name);
						var children = document.createElement('ul');
						children.className = 'ft-children';
						li.appendChild(children);
						li.onclick = (function (p, t, c) {
							return function (ev) { ev.stopPropagation(); toggleDir(p, t, c); };
						})(e.path, toggle, children);
					} else {
						var spacer = document.createElement('span');
						spacer.className = 'ft-toggle ft-vis-hidden';
						li.appendChild(spacer);
						var name = document.createElement('span');
						name.className = 'ft-name';
						name.textContent = e.name;
						li.appendChild(name);
						li.onclick = (function (p) {
							return function () { openFile(p); };
						})(e.path);
					}
					container.appendChild(li);
				}
			}

			function finishExpand(toggleEl, childList) {
				toggleEl.textContent = '\u25BC';
				childList.style.display = 'block';
			}

			function toggleDir(path, toggleEl, childList) {
				if (ftExpanded[path]) {
					childList.style.display = 'none';
					toggleEl.textContent = '\u25B6';
					delete ftExpanded[path];
					saveExpandedState();
				} else {
					if (!childList.children.length) {
						getCachedOrFetch(path).then(function (data) {
							renderDirContent(data, childList);
							finishExpand(toggleEl, childList);
							ftExpanded[path] = true;
							saveExpandedState();
						}).catch(function () {
							childList.innerHTML = '<li class="ft-item ft-error">Failed to load</li>';
							finishExpand(toggleEl, childList);
							ftExpanded[path] = true;
							saveExpandedState();
						});
					} else {
						finishExpand(toggleEl, childList);
						ftExpanded[path] = true;
						saveExpandedState();
					}
				}
			}

			// -- expand helpers for sequential async expansion --
			function expandDirInList(listEl, dirName, dirPath) {
				for (var i = 0; i < listEl.children.length; i++) {
					var item = listEl.children[i];
					if (item.classList.contains('ft-directory')) {
						var nameEl = item.querySelector('.ft-name');
						if (nameEl && nameEl.textContent === dirName) {
							var toggleEl = item.querySelector('.ft-toggle');
							var childList = item.querySelector('.ft-children');
							return new Promise(function (resolve) {
								if (ftExpanded[dirPath]) {
									resolve(childList);
								} else {
									if (!childList.children.length) {
										getCachedOrFetch(dirPath).then(function (data) {
											renderDirContent(data, childList);
											finishExpand(toggleEl, childList);
											ftExpanded[dirPath] = true;
											saveExpandedState();
											resolve(childList);
										}).catch(function () {
											childList.innerHTML = '<li class="ft-item ft-error">Failed to load</li>';
											finishExpand(toggleEl, childList);
											ftExpanded[dirPath] = true;
											saveExpandedState();
											resolve(childList);
										});
									} else {
										finishExpand(toggleEl, childList);
										ftExpanded[dirPath] = true;
										saveExpandedState();
										resolve(childList);
									}
								}
							});
						}
					}
				}
				return Promise.resolve(null);
			}

			function expandDirPath(listEl, parts, idx) {
				if (idx >= parts.length) return Promise.resolve();
				return expandDirInList(listEl, parts[idx], parts.slice(0, idx + 1).join('/')).then(function (childList) {
					if (childList) return expandDirPath(childList, parts, idx + 1);
				});
			}

			// -- state persistence --
			function saveExpandedState() {
				var paths = [];
				for (var key in ftExpanded) {
					if (key) paths.push(key);
				}
				if (paths.length) {
					localStorage.setItem('onair-ft-expanded', JSON.stringify(paths));
				} else {
					localStorage.removeItem('onair-ft-expanded');
				}
			}

			function restoreExpandedState() {
				var saved = localStorage.getItem('onair-ft-expanded');
				if (!saved) return Promise.resolve();
				var paths;
				try { paths = JSON.parse(saved); } catch (e) { return Promise.resolve(); }
				if (!paths || !paths.length) return Promise.resolve();
				var rootList = document.querySelector('.ft-list');
				if (!rootList) return Promise.resolve();
				paths.sort(function (a, b) { return a.split('/').length - b.split('/').length; });
				var promise = Promise.resolve();
				for (var i = 0; i < paths.length; i++) {
					(function (fullDirPath) {
						promise = promise.then(function () {
							return expandDirPath(rootList, fullDirPath.split('/'), 0);
						});
					})(paths[i]);
				}
				return promise;
			}

			// -- expand to current file --
			function expandToCurrentFile() {
				if (!rootDir || !fullPath) return Promise.resolve();
				if (ftExpandedToFile) return Promise.resolve();
				ftExpandedToFile = true;
				var rel = fullPath.replace(rootDir, '').replace(/^[/\\]/, '');
				var parts = rel.split(/[/\\]/);
				var fileName = parts.pop();
				if (!parts.length || (parts.length === 1 && parts[0] === '')) return Promise.resolve();
				var rootList = document.querySelector('.ft-list');
				if (!rootList) return Promise.resolve();
				function step(idx, listEl) {
					if (idx >= parts.length) {
						if (fileName) {
							for (var i = 0; i < listEl.children.length; i++) {
								var item = listEl.children[i];
								if (item.classList.contains('ft-file')) {
									var nameEl = item.querySelector('.ft-name');
									if (nameEl && nameEl.textContent === fileName) {
										item.classList.add('ft-current');
										item.scrollIntoView({ block: 'center' });
										break;
									}
								}
							}
						}
						return Promise.resolve();
					}
					return expandDirInList(listEl, parts[idx], parts.slice(0, idx + 1).join('/')).then(function (childList) {
						if (childList) return step(idx + 1, childList);
					});
				}
				return step(0, rootList);
			}

			// -- root tree rendering --
			function renderRootTree() {
				ftScroll.innerHTML = '';
				var ul = document.createElement('ul');
				ul.className = 'ft-list';
				ftScroll.appendChild(ul);
				getCachedOrFetch('').then(function (data) {
					renderDirContent(data, ul);
					return restoreExpandedState();
				}).then(function () {
					return expandToCurrentFile();
				}).catch(function (err) {
					ftScroll.innerHTML = '<div class="ft-loading ft-error">' + escapeHtml(err.message) + '</div>';
				});
			}

			// -- tab switching --
			function switchTab(name) {
				tabToc.classList.toggle('active', name === 'toc');
				tabTree.classList.toggle('active', name === 'tree');
				tocPanel.style.display = name === 'toc' ? 'flex' : 'none';
				treePanel.style.display = name === 'tree' ? 'flex' : 'none';
				localStorage.setItem('onair-sidebar-tab', name);
				if (name === 'tree') renderRootTree();
			}

			var savedTab = localStorage.getItem('onair-sidebar-tab');
			switchTab(savedTab === 'tree' ? 'tree' : 'toc');

			tabToc.onclick = function () { switchTab('toc'); };
			tabTree.onclick = function () { switchTab('tree'); };

			// -- filter change --
			(function () {
				var cbs = ['ftGitignore', 'ftMarkdown', 'ftBinary'].map(function (id) { return document.getElementById(id); });
				cbs.forEach(function (cb) {
					if (!cb) return;
					cb.onchange = function () {
						clearAllCache();
						for (var key in ftExpanded) delete ftExpanded[key];
						renderRootTree();
					};
				});
			})();

			// -- locate button --
			document.getElementById('ftLocateBtn').onclick = function () {
				ftExpandedToFile = false;
				expandToCurrentFile();
			};

			// -- websocket refresh hook --
			window.ftRefresh = function () {
				if (treePanel.style.display !== 'none') {
					clearAllCache();
					renderRootTree();
				}
			};

			// -- file opening --
			function openFile(filePath) {
				var ext = filePath.toLowerCase();
				if (ext.endsWith('.md') || ext.endsWith('.markdown')) {
					location.href = '/preview/' + id + '/' + encodeURIComponent(filePath);
				} else {
					var params = 'id=' + encodeURIComponent(id) + '&path=' + encodeURIComponent(filePath);
					fetch('/api/file?' + params).then(function (r) { return r.json(); }).then(function (data) {
						if (data.error) { contentEl.innerHTML = '<div class="file-view"><div class="file-view-header">Error: ' + escapeHtml(data.error) + '</div></div>'; return; }
						if (data.isBinary) {
							contentEl.innerHTML = '<div class="file-view"><div class="file-view-header"><button onclick="document.getElementById(\'tabTree\').click()">← Back</button><span class="file-path">' + escapeHtml(filePath) + '</span></div><div class="file-binary">Binary file, cannot preview</div></div>';
						} else {
							var code = escapeHtml(data.content);
							contentEl.innerHTML = '<div class="file-view"><div class="file-view-header"><button onclick="document.getElementById(\'tabTree\').click()">← Back</button><span class="file-path">' + escapeHtml(filePath) + '</span></div><pre><code class="hljs">' + code + '</code></pre></div>';
						}
					}).catch(function () {
						contentEl.innerHTML = '<div class="file-view"><div class="file-view-header">Error loading file</div></div>';
					});
				}
			}
		})();
		} catch (e) { console.error('file tree error', e); }

		// ---- websocket ----
		function connect() {
			ws = new WebSocket(proto + '://' + location.host + '/ws/' + id);
			ws.onopen = function () {
				bannerIcon.textContent = '🔌'; bannerMsg.textContent = 'Connected, live preview active…'; bannerTxt.title = 'Connected, live preview active…';
				bannerEl.classList.remove('offline');
				clearTimeout(reconnectTimer);
			};
			ws.onmessage = function (ev) {
				try {
					var msg = JSON.parse(ev.data);
					if (msg.type === 'update') {
						contentEl.innerHTML = msg.html;
						if (msg.fullPath) fullPath = msg.fullPath;
						if (msg.relPath != null) relPath = msg.relPath;
						buildToc();
						buildAnnotations();
						processFootnotes();
						if (document.getElementById('wpBtn').classList.contains('on')) contentEl.classList.add('wp');
						document.title = msg.title + ' · OnAir';
					} else if (msg.type === 'filetree-changed') {
						if (typeof ftRefresh === 'function') ftRefresh();
					} else if (msg.type === 'closed') {
						bannerIcon.textContent = '⚠️'; bannerMsg.textContent = 'Source file was closed in VS Code, preview will no longer update'; bannerTxt.title = 'Source file was closed in VS Code, preview will no longer update';
						bannerEl.classList.add('offline');
					}
				} catch (e) { /* ignore malformed message */ }
			};
			ws.onclose = function () {
				bannerIcon.textContent = '⚠️'; bannerMsg.textContent = 'Connection lost, reconnecting…'; bannerTxt.title = 'Connection lost, reconnecting…';
				bannerEl.classList.add('offline');
				reconnectTimer = setTimeout(connect, 1500);
			};
		}
		connect();
		buildToc();
		buildAnnotations();
		processFootnotes();
	})();
	</script>
</body>
