<!DOCTYPE html>
<html lang="en" class="onair-md">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<base href="/preview/{{ID}}/" />
<title>{{TITLE}} · OnAir</title>
<style>{{CSS}}</style>
</head>
<body>
	<div class="md-online-banner" id="banner"><span id="bannerTxt" title="Connected, live preview active…"><span id="bannerIcon">🔌</span><span id="bannerMsg" class="banner-msg">Connected, live preview active…</span></span>
	<select class="bp-select" id="themeSelect" title="Theme">
		<option value="auto">🌓 Auto</option>
		<option value="dark">🌙 Dark</option>
		<option value="light">☀️ Light</option>
	</select>
	<button class="wp-btn" id="wpBtn" title="Toggle word wrapping for code blocks">Wrap code</button>
	<button class="wp-btn" id="hoverBtn" title="Toggle hover preview for footnote/annotation notes">Hover notes</button>
	<span class="bp-group"><span class="bp-label" title="Font size">A</span>
		<button class="bp-btn" id="fsDec" title="Decrease font size">−</button>
		<input class="fs-input" id="fsInput" type="number" min="12" max="28" value="16" title="Font size (12-28)">
		<button class="bp-btn" id="fsReset" title="Reset font size to default">↺</button>
		<button class="bp-btn" id="fsInc" title="Increase font size">+</button></span>
	<span class="bp-group"><span class="bp-label" title="Scrollbar width">‖</span>
		<button class="bp-btn" id="sbDec" title="Thinner scrollbars">−</button>
		<input class="fs-input" id="sbInput" type="number" min="0" step="4" value="16" title="Scrollbar width">
		<button class="bp-btn" id="sbReset" title="Reset scrollbar width to default">↺</button>
		<button class="bp-btn" id="sbInc" title="Thicker scrollbars">+</button></span>
	<span class="bp-group"><span class="bp-label" title="Max content width (0 = no limit)">W</span>
		<button class="bp-btn" id="mwDec" title="Narrower content">−</button>
		<input class="fs-input" id="mwInput" type="number" min="0" step="20" value="920" title="Max content width in px (0 = no limit)">
		<button class="bp-btn" id="mwReset" title="Reset max width to default">↺</button>
		<button class="bp-btn" id="mwInc" title="Wider content">+</button></span>
	<div class="ver-badge" id="verBadge" title="OnAir version">v{{VERSION}}</div></div>
	<div id="wrapper"><div id="tocSide"><nav id="toc" class="toc"></nav><button id="tocToggle" class="toc-toggle" aria-label="Toggle table of contents">&lt;</button></div><div class="toc-resizer" id="tocResizer"></div><article class="markdown-body" id="content">{{BODY}}</article><div class="annot-resizer" id="annotResizer"></div><div id="annotSide"><div id="annots"></div><button id="annotToggle" class="annot-toggle" aria-label="Toggle annotations">&gt;</button></div></div>
	<script>
	(function () {
		var bannerEl = document.getElementById('banner');
		var bannerTxt = document.getElementById('bannerTxt');
		var bannerIcon = document.getElementById('bannerIcon');
		var bannerMsg = document.getElementById('bannerMsg');
		var contentEl = document.getElementById('content');
		var id = {{ID_JSON}};
		var fullPath = {{FULL_PATH_JSON}};
		var relPath = {{REL_PATH_JSON}};
		var proto = location.protocol === 'https:' ? 'wss' : 'ws';
		var ws, reconnectTimer;

		// ---- wrap toggle ----
		document.getElementById('wpBtn').onclick = function () {
			this.classList.toggle('on');
			this.textContent = this.classList.contains('on') ? 'Unwrap code' : 'Wrap code';
			contentEl.classList.toggle('wp');
		};

		// ---- theme select ----
		var themeSelect = document.getElementById('themeSelect');
		var html = document.documentElement;
		var saved = localStorage.getItem('onair-theme');
		if (saved) { themeSelect.value = saved; }
		applyTheme(themeSelect.value);

		themeSelect.onchange = function () {
			localStorage.setItem('onair-theme', this.value);
			applyTheme(this.value);
		};

		function applyTheme(val) {
			html.classList.remove('force-dark', 'force-light');
			if (val === 'dark') html.classList.add('force-dark');
			else if (val === 'light') html.classList.add('force-light');
		}

		// ---- font size ----
		var fs = parseInt(localStorage.getItem('onair-font-size')) || 16;
		var fsInput = document.getElementById('fsInput');
		contentEl.style.fontSize = fs + 'px';
		fsInput.value = fs;
		document.getElementById('fsDec').onclick = function () { setFs(fs - 2); };
		document.getElementById('fsInc').onclick = function () { setFs(fs + 2); };
		document.getElementById('fsReset').onclick = function () { setFs(16); };
		fsInput.onchange = function () {
			var v = parseInt(this.value);
			if (isNaN(v)) { this.value = fs; return; }
			setFs(v);
		};
		function withScrollAnchor(fn) {
			var se = document.scrollingElement || document.documentElement;
			var kids = contentEl.children, anchor = null;
			for (var i = 0; i < kids.length; i++) {
				if (kids[i].getBoundingClientRect().bottom > 0) { anchor = kids[i]; break; }
			}
			var before = anchor ? anchor.getBoundingClientRect().top : 0;
			fn();
			if (anchor) se.scrollTop += anchor.getBoundingClientRect().top - before;
		}
		function setFs(v) {
			withScrollAnchor(function () {
				fs = Math.max(12, Math.min(28, Math.round(v)));
				contentEl.style.fontSize = fs + 'px';
			});
			fsInput.value = fs;
			localStorage.setItem('onair-font-size', String(fs));
			if (typeof layoutCards === 'function') layoutCards();
		}

		// ---- scrollbar width ----
		var sbw = parseInt(localStorage.getItem('onair-scrollbar-width')) || 16;
		var sbInput = document.getElementById('sbInput');
		setSbw(sbw);
		document.getElementById('sbDec').onclick = function () { setSbw(sbw - 4); };
		document.getElementById('sbInc').onclick = function () { setSbw(sbw + 4); };
		document.getElementById('sbReset').onclick = function () { setSbw(16); };
		sbInput.onchange = function () {
			var v = parseInt(this.value);
			if (isNaN(v)) { this.value = sbw; return; }
			setSbw(v);
		};
		function setSbw(v) {
			sbw = Math.max(0, Math.round(v));
			document.documentElement.style.setProperty('--sb-w', sbw + 'px');
			sbInput.value = sbw;
			localStorage.setItem('onair-scrollbar-width', String(sbw));
		}

		// ---- max content width ----
		var mwInput = document.getElementById('mwInput');
		var mw = parseInt(localStorage.getItem('onair-max-width'));
		if (isNaN(mw)) mw = 920;
		setMw(mw);
		document.getElementById('mwDec').onclick = function () { setMw(mw - 20); };
		document.getElementById('mwInc').onclick = function () { setMw(mw + 20); };
		document.getElementById('mwReset').onclick = function () { setMw(920); };
		mwInput.onchange = function () {
			var v = parseInt(this.value);
			if (isNaN(v) || v < 0) { this.value = mw; return; }
			setMw(v);
		};
		function setMw(v) {
			mw = Math.max(0, Math.round(v));
			contentEl.style.maxWidth = mw ? mw + 'px' : 'none';
			mwInput.value = mw;
			localStorage.setItem('onair-max-width', String(mw));
		}

		{{TOC_JS}}

		// ---- table of contents ----
		function buildToc() {
			var toc = document.getElementById('toc');
			while (toc.firstChild) toc.removeChild(toc.firstChild);
			var hs = contentEl.querySelectorAll('h1,h2,h3,h4,h5,h6');
			toc.classList.toggle('no-tree', hs.length < 2);

			var master = buildTocHeader(toc, '📑 ' + document.title.replace(/ · OnAir$/, ''), fullPath, relPath);

			if (hs.length >= 2) {
				var listContainer = document.createElement('div');
				listContainer.id = 'toc-list';
				buildTocTree(hs, listContainer);
				initMasterToggle(toc, master);
				toc.appendChild(listContainer);
			bindTocInteractions(toc, contentEl);
		}

		buildRelatedLinks(toc, contentEl);
	}

		// ---- footnotes: wrap bottom block in a collapsible container ----
		function processFootnotes() {
			var sec = contentEl.querySelector('section.footnotes');
			if (!sec) return;
			var sep = contentEl.querySelector('hr.footnotes-sep');
			if (sep) sep.parentNode.removeChild(sep);
			var block = document.createElement('div');
			block.id = 'footnotes-block';
			var head = document.createElement('div');
			head.id = 'footnotes-head';
			var toggle = document.createElement('button');
			toggle.className = 'fn-toggle';
			toggle.type = 'button';
			var title = document.createElement('span');
			title.textContent = 'Footnotes';
			head.appendChild(toggle);
			head.appendChild(title);
			sec.parentNode.insertBefore(block, sec);
			block.appendChild(head);
			block.appendChild(sec);
			function setCollapsed(c) {
				block.classList.toggle('collapsed', c);
				toggle.textContent = c ? '\u25B8' : '\u25BE';
				localStorage.setItem('onair-footnotes-collapsed', c ? '1' : '0');
			}
			setCollapsed(localStorage.getItem('onair-footnotes-collapsed') === '1');
			head.onclick = function () { setCollapsed(!block.classList.contains('collapsed')); };
		}

		// ---- annotations: route ==mark==-adjacent notes into the right column ----
		var cardRegistry = [];
		var hoverOn = localStorage.getItem('onair-annot-hover') === '1';

		var pop = document.createElement('div');
		pop.id = 'annot-pop';
		pop.style.display = 'none';
		document.body.appendChild(pop);
		function hidePopover() { pop.style.display = 'none'; }
		function showPopover(evt, htmlStr) {
			pop.innerHTML = htmlStr;
			pop.style.display = 'block';
			pop.style.left = '0px'; pop.style.top = '0px';
			// Anchor to the mark's box (not the cursor) so the position is the same
			// whether you approach from above or below. The pointer can sit anywhere
			// within the mark and the hand extends ~24px downward, so keep the popover
			// well below the mark's bottom edge to guarantee it's never covered.
			var el = evt.currentTarget || evt.target;
			var r = el.getBoundingClientRect();
			var ph = pop.offsetHeight, pw = pop.offsetWidth;
			var gap = 30;
			var top = r.bottom + gap;
			if (top + ph > window.innerHeight - 8) {
				// no room below: flip above the mark (the hand sits below the pointer, so upward is clear)
				top = Math.max(8, r.top - ph - 12);
			}
			var left = r.left;
			if (left + pw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - pw - 8);
			pop.style.top = (top + window.pageYOffset) + 'px';
			pop.style.left = (left + window.pageXOffset) + 'px';
		}
		document.addEventListener('click', function (e) {
			if (pop.style.display !== 'none' && !pop.contains(e.target) && !(e.target.closest && e.target.closest('.annot-mark'))) hidePopover();
		});

		// ---- bare `.md` cross-reference popover (B3: reuses the same `/xref` HTML) ----
		(function () {
			var overlay = document.createElement('div');
			overlay.id = 'xrefOverlay';
			overlay.style.display = 'none';
			overlay.innerHTML = '<div class="xref-box" role="dialog"></div>';
			document.body.appendChild(overlay);
			var box = overlay.firstChild;
			function closeXref() { overlay.style.display = 'none'; box.innerHTML = ''; }
			overlay.addEventListener('click', function (e) { if (e.target === overlay) closeXref(); });
			document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeXref(); });
			document.addEventListener('click', function (e) {
				var a = e.target.closest && e.target.closest('a.onair-xref');
				if (!a) return;
				e.preventDefault();
				var href = a.getAttribute('href');
				box.innerHTML = '<div class="xref-loading">Loading…</div>';
				overlay.style.display = 'flex';
				fetch(href).then(function (r) { return r.text(); }).then(function (html) {
					box.innerHTML = html.replace(/<script[\s\S]*?<\/script>/gi, '');
				}).catch(function () { box.innerHTML = '<p class="empty">Failed to load references.</p>'; });
			});
		})();
		function annotColumnVisible() {
			var side = document.getElementById('annotSide');
			return getComputedStyle(side).display !== 'none' && !side.classList.contains('collapsed');
		}

		function prevMark(ref) {
			var n = ref.previousSibling;
			while (n && n.nodeType === 3 && !/\S/.test(n.textContent)) n = n.previousSibling;
			if (n && n.nodeType === 1 && n.tagName === 'MARK') return n;
			return null;
		}
		function markDocY(el) { return el.getBoundingClientRect().top + window.pageYOffset; }

		function activate(aid, scroll) {
			for (var i = 0; i < cardRegistry.length; i++) {
				var on = cardRegistry[i].id === aid;
				cardRegistry[i].mark.classList.toggle('active', on);
				cardRegistry[i].card.classList.toggle('active', on);
				cardRegistry[i].card.style.zIndex = on ? '5' : '';
				if (on && scroll) cardRegistry[i].card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
			}
		}

		function layoutCards() {
			if (!cardRegistry.length) return;
			if (document.getElementById('annotSide').classList.contains('collapsed')) return;
			var annots = document.getElementById('annots');
			annots.style.minHeight = contentEl.offsetHeight + 'px';
			var base = markDocY(annots);
			var items = cardRegistry.slice().sort(function (a, b) { return markDocY(a.mark) - markDocY(b.mark); });
			var prevBottom = -1e9, gap = 12;
			for (var i = 0; i < items.length; i++) {
				var natural = markDocY(items[i].mark) - base;
				var y = Math.max(natural, prevBottom + gap);
				items[i].card.style.top = y + 'px';
				prevBottom = y + items[i].card.offsetHeight;
			}
		}

		function buildAnnotations() {
			var side = document.getElementById('annotSide');
			var annots = document.getElementById('annots');
			annots.innerHTML = '';
			cardRegistry = [];

			var refs = contentEl.querySelectorAll('sup.footnote-ref');
			var sec = contentEl.querySelector('section.footnotes');
			var liById = {};
			if (sec) {
				var lis = sec.querySelectorAll('li.footnote-item');
				for (var i = 0; i < lis.length; i++) liById[lis[i].id] = lis[i];
			}

			var annId = 0;
			for (var r = 0; r < refs.length; r++) {
				var ref = refs[r];
				var markEl = prevMark(ref);
				if (!markEl) {
					var fa = ref.querySelector('a');
					var fli = fa && liById[(fa.getAttribute('href') || '').replace(/^#/, '')];
					if (fli) {
						var fclone = fli.cloneNode(true);
						var fback = fclone.querySelector('.footnote-backref');
						if (fback) fback.parentNode.removeChild(fback);
						(function (m, htmlStr) {
							m.onmouseenter = function (e) { if (hoverOn) showPopover(e, htmlStr); };
							m.onmouseleave = function () { if (hoverOn) hidePopover(); };
						})(ref, fclone.innerHTML);
					}
					continue;
				}
				var a = ref.querySelector('a');
				if (!a) continue;
				var fnId = (a.getAttribute('href') || '').replace(/^#/, '');
				var li = liById[fnId];
				if (!li) continue;

				annId++;
				var aid = 'a' + annId;
				markEl.setAttribute('data-annot-id', aid);
				markEl.classList.add('annot-mark');
				ref.style.display = 'none';

				var card = document.createElement('div');
				card.className = 'annot-card';
				card.setAttribute('data-annot-id', aid);
				var clone = li.cloneNode(true);
				var back = clone.querySelector('.footnote-backref');
				if (back) back.parentNode.removeChild(back);
				var cardHtml = clone.innerHTML;
				card.innerHTML = cardHtml;
				annots.appendChild(card);
				li.parentNode.removeChild(li);

				cardRegistry.push({ id: aid, mark: markEl, card: card });
				(function (id, mark, cardEl, htmlStr) {
					mark.onclick = function (e) {
						if (annotColumnVisible()) { activate(id, true); }
						else { showPopover(e, htmlStr); if (e) e.stopPropagation(); }
					};
					cardEl.onclick = function () { activate(id, false); };
					mark.onmouseenter = function (e) {
						if (!hoverOn) return;
						if (annotColumnVisible()) activate(id, false); else showPopover(e, htmlStr);
					};
					mark.onmouseleave = function () { if (hoverOn && !annotColumnVisible()) hidePopover(); };
					cardEl.onmouseenter = function () { if (hoverOn) activate(id, false); };
				})(aid, markEl, card, cardHtml);
			}

			if (sec && !sec.querySelector('li.footnote-item')) {
				var sep = contentEl.querySelector('hr.footnotes-sep');
				if (sep) sep.parentNode.removeChild(sep);
				sec.parentNode.removeChild(sec);
			}

			var has = cardRegistry.length > 0;
			side.style.display = has ? '' : 'none';
			document.getElementById('annotResizer').style.display = (has && !side.classList.contains('collapsed')) ? '' : 'none';
			if (has) layoutCards();
		}

		// ---- annotation column resize ----
		(function () {
			attachResizer(document.getElementById('annotResizer'), document.getElementById('annotSide'), {
				axis: 'x', invert: true, key: 'onair-annot-width', def: null, min: 120, max: Infinity,
				get: function (el) { return el.offsetWidth; },
				set: function (el, v) { el.style.width = v + 'px'; layoutCards(); }
			});
		})();

		// ---- annotation column collapse handle ----
		(function () {
			var handle = document.getElementById('annotToggle');
			var side = document.getElementById('annotSide');
			var resizer = document.getElementById('annotResizer');
			function setCollapsed(c) {
				side.classList.toggle('collapsed', c);
				handle.textContent = c ? '<' : '>';
				handle.title = c ? 'Show annotations' : 'Hide annotations';
				if (cardRegistry.length) resizer.style.display = c ? 'none' : '';
				localStorage.setItem('onair-annot-collapsed', c ? '1' : '0');
				if (!c) layoutCards();
			}
			setCollapsed(localStorage.getItem('onair-annot-collapsed') === '1');
			handle.onclick = function () { setCollapsed(!side.classList.contains('collapsed')); };
		})();

		// ---- hover-preview switch (shared by footnotes/annotations) ----
		(function () {
			var hoverBtn = document.getElementById('hoverBtn');
			if (hoverOn) hoverBtn.classList.add('on');
			hoverBtn.onclick = function () {
				hoverOn = !hoverOn;
				this.classList.toggle('on', hoverOn);
				localStorage.setItem('onair-annot-hover', hoverOn ? '1' : '0');
				if (!hoverOn) hidePopover();
			};
		})();

		window.addEventListener('resize', function () { layoutCards(); hidePopover(); });
		window.addEventListener('load', function () { layoutCards(); });

		// ---- TOC resize ----
		(function () {
			var resizer = document.getElementById('tocResizer');
			var toc = document.getElementById('toc');
			attachResizer(resizer, toc, {
				axis: 'x', invert: false, key: 'onair-toc-width', def: null, min: 24, max: Infinity,
				get: function (el) { return el.offsetWidth; },
				set: function (el, v) { el.style.width = v + 'px'; }
			});
		})();

		// ---- TOC collapse handle ----
		(function () {
			var handle = document.getElementById('tocToggle');
			var side = document.getElementById('tocSide');
			function setCollapsed(c) {
				side.classList.toggle('collapsed', c);
				handle.textContent = c ? '>' : '<';
				handle.title = c ? 'Show table of contents' : 'Hide table of contents';
				localStorage.setItem('onair-toc-collapsed', c ? '1' : '0');
			}
			setCollapsed(localStorage.getItem('onair-toc-collapsed') === '1');
			handle.onclick = function () { setCollapsed(!side.classList.contains('collapsed')); };
		})();

		// ---- websocket ----
		function connect() {
			ws = new WebSocket(proto + '://' + location.host + '/ws/' + id);
			ws.onopen = function () {
				bannerIcon.textContent = '🔌'; bannerMsg.textContent = 'Connected, live preview active…'; bannerTxt.title = 'Connected, live preview active…';
				bannerEl.classList.remove('offline');
				clearTimeout(reconnectTimer);
			};
			ws.onmessage = function (ev) {
				try {
					var msg = JSON.parse(ev.data);
					if (msg.type === 'update') {
						contentEl.innerHTML = msg.html;
						if (msg.fullPath) fullPath = msg.fullPath;
						if (msg.relPath != null) relPath = msg.relPath;
						buildToc();
						buildAnnotations();
						processFootnotes();
						if (document.getElementById('wpBtn').classList.contains('on')) contentEl.classList.add('wp');
						document.title = msg.title + ' · OnAir';
					} else if (msg.type === 'closed') {
						bannerIcon.textContent = '⚠️'; bannerMsg.textContent = 'Source file was closed in VS Code, preview will no longer update'; bannerTxt.title = 'Source file was closed in VS Code, preview will no longer update';
						bannerEl.classList.add('offline');
					}
				} catch (e) { /* ignore malformed message */ }
			};
			ws.onclose = function () {
				bannerIcon.textContent = '⚠️'; bannerMsg.textContent = 'Connection lost, reconnecting…'; bannerTxt.title = 'Connection lost, reconnecting…';
				bannerEl.classList.add('offline');
				reconnectTimer = setTimeout(connect, 1500);
			};
		}
		connect();
		buildToc();
		buildAnnotations();
		processFootnotes();
	})();
	</script>
</body>
</html>
